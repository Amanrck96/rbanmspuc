<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Shield Emblem -->
  <g transform="translate(10, 5)">
    <path d="M 45 5 L 80 15 C 80 55 60 78 45 88 C 30 78 10 55 10 15 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Book -->
    <path d="M 28 42 Q 37 38 45 43 Q 53 38 62 42 L 62 60 Q 53 56 45 61 Q 37 56 28 60 Z" fill="#ffffff" opacity="0.95"/>
    <line x1="45" y1="43" x2="45" y2="61" stroke="#1e3a8a" stroke-width="2"/>
    <!-- Torch flame -->
    <path d="M 45 22 C 40 28 43 33 45 35 C 47 33 50 28 45 22 Z" fill="url(#goldGrad)"/>
    <!-- Stars -->
    <circle cx="45" cy="74" r="3" fill="#fbbf24"/>
  </g>
  <!-- Typography -->
  <text x="105" y="32" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="22" font-weight="800" fill="#1e3a8a" letter-spacing="1.2">RBANM'S</text>
  <text x="105" y="55" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.5">PRE-UNIVERSITY COLLEGE</text>
  <text x="105" y="74" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#b45309" letter-spacing="0.8">ESTD 1883 • BENGALURU • KARNATAKA</text>
</svg>
