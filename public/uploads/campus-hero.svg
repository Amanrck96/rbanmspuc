<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#skyGrad)"/>
  <!-- Campus Lawn -->
  <rect y="440" width="1200" height="160" fill="url(#lawnGrad)"/>
  <!-- Trees -->
  <circle cx="150" cy="430" r="70" fill="#166534" opacity="0.8"/>
  <circle cx="230" cy="420" r="80" fill="#15803d" opacity="0.9"/>
  <circle cx="1050" cy="430" r="75" fill="#166534" opacity="0.8"/>
  <circle cx="970" cy="420" r="80" fill="#15803d" opacity="0.9"/>
  <!-- Heritage Academic Block -->
  <rect x="250" y="200" width="700" height="250" fill="url(#buildingGrad)" rx="8"/>
  <polygon points="600,80 230,200 970,200" fill="#b45309"/>
  <!-- Clock Tower -->
  <rect x="540" y="100" width="120" height="100" fill="#1e3a8a"/>
  <polygon points="600,40 530,100 670,100" fill="#d97706"/>
  <circle cx="600" cy="140" r="28" fill="#ffffff" stroke="#b45309" stroke-width="4"/>
  <line x1="600" y1="140" x2="600" y2="125" stroke="#1e3a8a" stroke-width="3"/>
  <line x1="600" y1="140" x2="615" y2="140" stroke="#1e3a8a" stroke-width="3"/>
  <!-- Arches and Windows -->
  <g fill="#fef3c7" opacity="0.9">
    <rect x="290" y="240" width="50" height="70" rx="25"/>
    <rect x="370" y="240" width="50" height="70" rx="25"/>
    <rect x="450" y="240" width="50" height="70" rx="25"/>
    <rect x="700" y="240" width="50" height="70" rx="25"/>
    <rect x="780" y="240" width="50" height="70" rx="25"/>
    <rect x="860" y="240" width="50" height="70" rx="25"/>
    <!-- Ground floor arches -->
    <rect x="290" y="340" width="50" height="80" rx="25"/>
    <rect x="370" y="340" width="50" height="80" rx="25"/>
    <rect x="450" y="340" width="50" height="80" rx="25"/>
    <rect x="560" y="320" width="80" height="120" rx="40" fill="#fbbf24"/>
    <rect x="700" y="340" width="50" height="80" rx="25"/>
    <rect x="780" y="340" width="50" height="80" rx="25"/>
    <rect x="860" y="340" width="50" height="80" rx="25"/>
  </g>
  <!-- Foreground Banner -->
  <rect x="300" y="500" width="600" height="70" rx="10" fill="#ffffff" opacity="0.95" stroke="#1e3a8a" stroke-width="2"/>
  <text x="600" y="535" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="800" fill="#1e3a8a">RBANMS PRE-UNIVERSITY COLLEGE</text>
  <text x="600" y="555" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#b45309">HISTORIC CAMPUS • ESTABLISHED 1883 • BENGALURU</text>
</svg>
